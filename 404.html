<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>找不到頁面｜IG 追蹤分析器</title>
<script>try{let t=localStorage.getItem("ig-theme-v1");try{t=JSON.parse(t)}catch(e){}if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#fafafa;--fg:#262626;--mut:#6b6b6b;--grad:linear-gradient(45deg,#feda75,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5);color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;text-align:center;padding:24px}
h1{font-size:4rem;margin:0;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--mut);margin:6px 0 22px}
a{display:inline-block;padding:11px 24px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;text-decoration:none}
</style>
</head>
<body><main><h1>404</h1><p>找不到這個頁面，網址可能打錯了。</p><a href="/">回到 IG 追蹤分析器</a></main></body>
</html>
